# Convierte a WebP las imágenes PNG/JPG subidas a public/images (por ejemplo
# desde la web de GitHub, sin Node instalado) y commitea el resultado.
name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - "public/images/**/*.png"
      - "public/images/**/*.jpg"
      - "public/images/**/*.jpeg"

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run images
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/images content
          git diff --cached --quiet || git commit -m "chore: optimize images to WebP"
          git push
