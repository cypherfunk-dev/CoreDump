server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;

    # Assets con hash en el nombre: cache inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2|xml)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # La búsqueda es la única ruta dinámica (SPA)
    location /search/ {
        try_files $uri $uri/ /search/index.html;
    }

    # Todo lo demás está prerenderizado (dist/<ruta>/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
