server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/markdown image/svg+xml;

    # Assets con hash en el nombre: cache inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Contenido estático (markdown, imágenes): revalidar
    location ~* \.(md|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
